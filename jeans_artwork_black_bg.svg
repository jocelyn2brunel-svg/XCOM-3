<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Jeans roulé sur fond noir">
  <rect width="1024" height="1024" fill="#000000"/>

  <defs>
    <linearGradient id="denimMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b8fda"/>
      <stop offset="60%" stop-color="#365f9f"/>
      <stop offset="100%" stop-color="#22457b"/>
    </linearGradient>
    <linearGradient id="denimFold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f6bac"/>
      <stop offset="100%" stop-color="#1e3768"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="blur"/>
      <feOffset dx="12" dy="20" result="offset"/>
      <feMerge>
        <feMergeNode in="offset"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ombre portée -->
  <ellipse cx="560" cy="770" rx="290" ry="95" fill="#050505" opacity="0.8"/>

  <!-- Forme principale du jean roulé -->
  <g filter="url(#shadow)">
    <path d="M288 642
             C274 512, 354 390, 520 352
             C705 309, 868 400, 902 538
             C933 663, 851 780, 676 820
             C470 865, 312 804, 288 642 Z"
          fill="url(#denimMain)"/>

    <!-- Repli avant -->
    <path d="M286 654
             C292 549, 364 482, 490 482
             C605 482, 680 543, 705 638
             C733 737, 678 820, 550 844
             C406 870, 300 795, 286 654 Z"
          fill="url(#denimFold)" opacity="0.95"/>

    <!-- Rouleau central -->
    <ellipse cx="452" cy="652" rx="126" ry="92" fill="#1f3c73"/>
    <ellipse cx="452" cy="652" rx="82" ry="60" fill="#102548"/>
    <ellipse cx="452" cy="652" rx="52" ry="38" fill="#050d1f"/>

    <!-- Coutures -->
    <path d="M320 536 L768 700" stroke="#efb13a" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M295 585 L736 738" stroke="#efb13a" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M384 404 L784 528" stroke="#b08f60" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.92"/>

    <!-- Ficelle -->
    <path d="M436 356 C520 376, 627 402, 760 458" stroke="#b68f64" stroke-width="12" stroke-linecap="round" fill="none"/>
  </g>
</svg>
